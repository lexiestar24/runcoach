<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16110d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RunCoach">
<title>RunCoach</title>
<style>
  /* Single warm, earthy dark theme. Variable names are kept from the original
     palette for stability; the values are repointed to earthy tones. So e.g.
     --blue is a terracotta/ochre primary, --orange a rust, --green an olive. */
  :root{
    color-scheme: dark;
    --page:#16110d; --surface:#201a14; --surface-2:#2b231b;
    --text:#f0e7d8; --text-2:#c2b3a0; --muted:#94806c;
    --grid:#322a20; --baseline:#4a3f30; --border:rgba(240,231,216,.11);
    --blue:#fdc57e;   /* primary: warm peach (easy) */
    --green:#837e31;  /* olive */
    --magenta:#cf8f83;/* dusty rose */
    --yellow:#e6c057; /* golden ochre */
    --aqua:#5f9e8b;   /* sage-teal */
    --orange:#004f46; /* deep teal (moderate) */
    --violet:#6f88a0; /* muted denim (was mauve/pink) */
    --red:#ae5225;    /* burnt rust (hard) */
    --good:#94b052; --warning:#e0a83f; --serious:#d98a5e; --critical:#cf5a3f;
    --success-ink:#a9c15c;
    --shadow:0 1px 3px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:1000px;margin:0 auto;padding:16px 16px 64px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 20px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;letter-spacing:-.02em}
  h1 .dot{color:var(--blue)}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:8px 14px;cursor:pointer;box-shadow:var(--shadow)}
  button:active{transform:translateY(1px)}
  section{margin:22px 0}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:600}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:12px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .tile .k{font-size:12px;color:var(--text-2)}
  .tile .v{font-size:30px;font-weight:650;letter-spacing:-.02em;margin-top:6px;line-height:1}
  .tile .v small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
  .tile .d{font-size:12px;margin-top:6px;color:var(--muted)}
  .up{color:var(--success-ink);font-weight:600}
  /* readiness hero */
  .hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .ring{flex:0 0 auto}
  .hero .body{flex:1;min-width:220px}
  .hero .label{font-size:22px;font-weight:650;letter-spacing:-.02em}
  .hero .verdict{color:var(--text-2);margin:6px 0 12px;font-size:15px;line-height:1.45}
  /* readiness across the day: wake -> now -> the hour she actually runs */
  .asof{font-size:12px;color:var(--muted);margin-top:3px}
  .tline{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
  .tpt{flex:1 1 92px;background:var(--page);border:1px solid var(--border);border-radius:11px;padding:8px 10px}
  .tpt.now{border-color:var(--blue)}
  .tpt.proj{border-style:dashed}
  .tpt .t{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .tpt .s{font-size:21px;font-weight:650;line-height:1.15;margin-top:3px}
  .tpt .l{font-size:11px;color:var(--text-2)}
  .projnote{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.45}
  .reasons{list-style:none;padding:0;margin:0;display:grid;gap:6px}
  .reasons li{font-size:13px;color:var(--text-2);padding-left:18px;position:relative;line-height:1.4}
  .reasons li::before{content:"";position:absolute;left:2px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
  /* progress */
  .bar{height:12px;border-radius:6px;background:var(--grid);overflow:hidden;margin:10px 0 6px}
  .bar > i{display:block;height:100%;border-radius:6px;background:var(--blue)}
  /* tips + adjustments */
  .stack{display:grid;gap:10px}
  .note{background:var(--surface);border:1px solid var(--border);border-left-width:4px;border-radius:12px;
    padding:12px 14px;font-size:14px;line-height:1.5;color:var(--text-2);box-shadow:var(--shadow)}
  .note .tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    color:var(--text);margin-bottom:4px}
  .note.win{border-left-color:var(--good)} .note.recovery{border-left-color:var(--blue)}
  .note.sleep{border-left-color:var(--green)} .note.pacing{border-left-color:var(--orange)}
  .note.high{border-left-color:var(--critical)} .note.med{border-left-color:var(--warning)}
  .note.low{border-left-color:var(--baseline)}
  /* charts */
  .winctl{display:flex;flex-direction:column;gap:10px;margin:0 0 12px}
  .seg{display:flex;width:100%;border:1px solid var(--border);border-radius:11px;overflow:hidden}
  .segbtn{flex:1;background:var(--surface);border:none;border-radius:0;padding:10px 12px;font-size:13px;
    box-shadow:none;color:var(--text-2);text-align:center}
  .segbtn+.segbtn{border-left:1px solid var(--border)}
  .segbtn.on{background:#004f46;color:#f0e7d8;font-weight:700}
  .stepper{display:flex;width:100%;align-items:center;gap:10px}
  .stepbtn{flex:0 0 auto;background:#ae5225;color:#fff;border-color:transparent;
    padding:9px 16px;font-size:13px;font-weight:600;border-radius:9px}
  .stepbtn[disabled]{opacity:.32;pointer-events:none}
  .winlab{flex:1;font-size:12.5px;color:var(--text-2);text-align:center;font-variant-numeric:tabular-nums}
  .norange{color:var(--muted);font-size:13px;padding:26px 4px;text-align:center}
  .chart-title{font-size:14px;font-weight:600;margin:0 0 2px}
  .chart-sub{font-size:12px;color:var(--muted);margin:0 0 12px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  svg{display:block;max-width:100%;height:auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-2)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  @media(max-width:599px){.legend{flex-direction:column;flex-wrap:nowrap;align-items:flex-start;
    gap:8px;font-size:13px;margin-top:12px}}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .legend i.line{height:3px;border-radius:2px;width:16px}
  /* schedule list (stacked rows, never scrolls sideways) */
  .schedcard{padding:0;overflow:hidden}
  .sched{display:flex;flex-direction:column}
  .wkhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    background:#004f46;color:#f0e7d8;font-weight:700;font-size:11px;
    text-transform:uppercase;letter-spacing:.06em;padding:8px 14px}
  .wkhead .wkdates{font-weight:600;letter-spacing:.02em;opacity:.75;text-transform:none}
  .srow{padding:11px 14px;border-bottom:1px solid var(--grid);cursor:pointer}
  .srow:last-child{border-bottom:none}
  .srow:hover,.srow:focus-visible{background:var(--surface-2);outline:none}
  .sr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sr-day{font-weight:650;font-size:14px;min-width:30px}
  .sr-date{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
  .sr-gap{flex:1;min-width:0}
  .sr-bot{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:6px}
  .sv{display:inline-flex;align-items:baseline;gap:5px;font-size:13px}
  .sv-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  .sv-v{color:var(--text-2);font-variant-numeric:tabular-nums}
  .sv.hit .sv-v{color:var(--text);font-weight:600}
  .sv.miss .sv-v{color:var(--muted)}
  .moved{color:var(--muted);font-size:11px}
  .chev{color:var(--muted)}
  /* detail nav */
  .navrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .navbtn{font-size:13px;padding:6px 12px;border-radius:9px;background:#ae5225;color:#fff;border-color:transparent}
  .navbtn[disabled]{opacity:.3;cursor:default;pointer-events:none}
  .navpos{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.open{display:flex}
  .sheet{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.5);
    width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    /* pan-y: the browser may scroll this vertically but must never claim a
       sideways drag, otherwise it starts scrolling before our swipe threshold
       is reached and preventDefault() no longer has any effect. contain stops
       an over-scroll at the top from chaining out to the page behind. */
    touch-action:pan-y;overscroll-behavior:contain}
  @media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}
  .sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--baseline);margin:0 auto 14px}
  /* touch gestures: drag follows the finger, release springs back or commits */
  .sheet.snap{transition:transform .22s cubic-bezier(.2,.7,.3,1),opacity .22s ease}
  /* while the sheet is open the page behind is pinned, so a dismiss drag can
     never double as a background scroll */
  body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden}
  .sheet h3{margin:0 0 2px;font-size:18px;letter-spacing:-.01em}
  .sheet .meta{color:var(--muted);font-size:13px;margin-bottom:14px}
  .block{margin:14px 0}
  .block .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:6px}
  .block .txt{font-size:14px;line-height:1.55;color:var(--text-2);white-space:pre-wrap}
  .warm{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .warm ol{margin:0;padding-left:18px} .warm li{font-size:14px;line-height:1.5;color:var(--text-2);margin:3px 0}
  .statrow{display:flex;gap:18px;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:12px 14px}
  .statrow .s .k{font-size:11px;color:var(--muted)} .statrow .s .v{font-size:18px;font-weight:650}
  .eval{background:var(--surface-2);border-radius:12px;padding:12px 14px;border-left:4px solid var(--good)}
  .eval.short,.eval.easy-for-hard,.eval.flat{border-left-color:var(--warning)}
  .eval.ran-hot{border-left-color:var(--serious)}
  .eval.breakthrough,.eval.gutsy{border-left-width:5px}
  .eval-h{font-weight:650;font-size:14.5px;margin-bottom:6px}
  .eval-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;
    background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
  .eval-pts{margin:0;padding-left:18px} .eval-pts li{font-size:13.5px;line-height:1.5;color:var(--text-2);margin:3px 0}
  .closex{position:sticky;top:0;float:right;background:none;border:none;box-shadow:none;font-size:22px;color:var(--muted);padding:0 4px;cursor:pointer}
  .tip{position:fixed;z-index:60;display:none;pointer-events:none;background:var(--surface-2);
    border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--text);
    box-shadow:var(--shadow);max-width:250px;line-height:1.45}
  .tip b{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px;text-transform:none}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
  .pill.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--success-ink)}
  .pill.upcoming{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
  .pill.missed{background:color-mix(in srgb,var(--baseline) 30%,transparent);color:var(--text-2)}
  .pill.moved{background:color-mix(in srgb,var(--yellow) 18%,transparent);color:var(--yellow)}
  /* reschedule control + dialog */
  .movebtn{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:8px;
    background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);box-shadow:none}
  .movebtn:hover{background:#ae5225;color:#fff;border-color:transparent}
  .rsoverlay{z-index:70}
  .rssheet{touch-action:auto;max-width:460px}
  .rssheet h3{margin:0 0 4px;font-size:18px}
  .rs-meta{color:var(--text-2);font-size:14px;margin-bottom:2px}
  .rs-cur{color:var(--muted);font-size:13px;margin-bottom:16px}
  .rs-cur b{color:var(--yellow);font-weight:600}
  .rs-lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    font-weight:600;margin:0 0 8px}
  .rs-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin-bottom:18px}
  .rs-chip{padding:9px 6px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);
    font-size:12.5px;line-height:1.3;text-align:center;box-shadow:none;color:var(--text-2)}
  .rs-chip b{display:block;font-size:14px;color:var(--text);font-weight:650}
  .rs-chip.on{background:#004f46;border-color:transparent;color:#f0e7d8}
  .rs-chip.on b{color:#fff}
  .rs-chip.busy{opacity:.55}
  input[type=date]{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface-2);
    border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:16px}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8);cursor:pointer}
  .rs-warn{font-size:13px;line-height:1.45;border-radius:10px;padding:10px 12px;margin-bottom:16px;
    background:color-mix(in srgb,var(--warning) 13%,transparent);color:var(--warning)}
  .rs-actions{display:flex;gap:8px;flex-wrap:wrap}
  .rs-actions .grow{flex:1;min-width:0}
  .rs-save{background:#ae5225;color:#fff;border-color:transparent;font-weight:650}
  .rs-save[disabled]{opacity:.4;pointer-events:none}
  .rs-reset{background:none;border-color:var(--border);color:var(--text-2);font-size:13px}
  .wt{font-size:11px;padding:1px 7px;border-radius:5px;color:#fff;font-weight:600}
  .loading{color:var(--muted);text-align:center;padding:60px 0}
  .err{color:var(--critical);text-align:center;padding:40px 0;font-size:14px}
  @media(max-width:520px){ .tile .v{font-size:26px} .wrap{padding:12px 12px 60px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Run<span class="dot">·</span>Coach</h1>
      <div class="sub" id="stamp">loading…</div>
    </div>
    <button id="refresh">↻ Sync Garmin</button>
  </header>
  <div id="app"><div class="loading">Loading your data…</div></div>
</div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="overlay rsoverlay" id="rsoverlay"><div class="sheet rssheet" id="rssheet"></div></div>
<div class="tip" id="tip"></div>

<script>
const $ = (s,el=document)=>el.querySelector(s);
const el = (t,attrs={},kids=[])=>{const n=document.createElementNS(t==='svg'||SVGTAGS.has(t)?SVGNS:HTMLNS,t);
  for(const k in attrs){if(k==='class')n.setAttribute('class',attrs[k]);else if(k==='html')n.innerHTML=attrs[k];else if(k==='text')n.textContent=attrs[k];else n.setAttribute(k,attrs[k]);}
  (Array.isArray(kids)?kids:[kids]).forEach(c=>{if(c==null||c===false)return;
    n.appendChild(typeof c==='object'?c:document.createTextNode(String(c)));});return n;};
const SVGNS='http://www.w3.org/2000/svg',HTMLNS='http://www.w3.org/1999/xhtml';
const SVGTAGS=new Set(['svg','g','path','rect','line','circle','text','polyline','defs','clipPath']);
const cssv=n=>n&&n.startsWith('--')?getComputedStyle(document.documentElement).getPropertyValue(n).trim():n;
// Effort-based coloring: easy days vs hard days, matching the effort chart's dots.
const HARD_SET=new Set(['tempo','interval','race']);
const effortColor=t=>HARD_SET.has(t)?'--red':'--blue';

// short date like "Jul 18"
const fmtDate=iso=>{try{return new Date(iso+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}catch(e){return iso;}};

// shared hover/tap tooltip
function bindTip(node,html){
  node.style.cursor='pointer';
  node.style.touchAction='manipulation';
  const show=e=>{const t=$('#tip');t.innerHTML=html;t.style.display='block';
    const r=t.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;
    if(x+r.width>window.innerWidth-8)x=e.clientX-r.width-14;
    if(y+r.height>window.innerHeight-8)y=e.clientY-r.height-14;
    t.style.left=Math.max(6,x)+'px';t.style.top=Math.max(6,y)+'px';};
  // mouse: follow hover. touch: tap shows and stays until you tap elsewhere.
  node.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')show(e);});
  node.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')show(e);});
  node.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')$('#tip').style.display='none';});
  node.addEventListener('pointerdown',e=>{e.stopPropagation();show(e);});
  // stop the long-press text-selection / "search Google" popup on touch
  node.addEventListener('contextmenu',e=>e.preventDefault());
}

// schedule rows (ordered) + current index, for prev/next navigation in the detail sheet
let SCHED=[], schedIdx=0;
// dashboard data + the trends time-window (default: latest 2 weeks, step by week)
let DATA=null, winState={all:false, weeks:2, offset:0};

// ---------- chart helpers (inline SVG) ----------
function svgEl(w,h){return el('svg',{viewBox:`0 0 ${w} ${h}`,width:w,height:h,role:'img'});}
// Charts are authored at 680px wide but CSS scales them down to fit a phone,
// which shrinks 10px SVG text to ~6px. On mobile we draw larger type in user
// units so it lands at a readable size after that downscale, and move the wordy
// band/reference labels out of the plot into an HTML legend underneath.
const MOBILE=()=>window.matchMedia('(max-width:599px)').matches;
const FS=()=>MOBILE()?{ax:15,date:15,tag:15,ref:15}:{ax:10,date:10,tag:10,ref:10};

// Round, evenly spaced y-axis ticks. Slicing the data range into a fixed number
// of parts produced labels like 0 / 3 / 7 / 10, which read as an uneven scale
// even though the spacing is uniform. Pick a round step instead (1, 2, 3, 5 or
// 10 times a power of ten) and let the tick count fall out of it.
function niceAxis(lo,hi,{zero=false,maxTicks=5}={}){
  if(zero)lo=0;
  if(!(hi>lo))hi=lo+1;
  const mags=[1,2,3,5,10], raw=(hi-lo)/maxTicks;
  const p=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=(mags.find(m=>m*p>=raw-1e-9)||10)*p;
  const min=Math.floor(lo/step+1e-9)*step, max=Math.ceil(hi/step-1e-9)*step;
  const ticks=[]; for(let v=min;v<=max+step*1e-9;v+=step)ticks.push(+v.toFixed(6));
  // whole-number steps get whole-number labels; a 0.5 step needs the decimal
  const fmt=v=>step%1?v.toFixed(1):String(Math.round(v));
  return {min,max,ticks,fmt};
}

function lineChart(data,{yKey,w=680,h=220,color='--blue',fmt=v=>v,bands=[],baseline=null,unit='',
    ptColor=null,tipHtml=null,line=true,refs=[]}){
  const mob=MOBILE(), fs=FS();
  // Reference-line labels (baseline + refs) live in a right-hand margin, clear of
  // the plotted lines. Size the right pad to the widest such label so nothing overlaps.
  // On mobile that margin would eat the plot, so labels move to the legend instead.
  const rlabs=[];
  if(baseline!=null) rlabs.push(`baseline ${fmt(baseline)}`);
  refs.forEach(r=>rlabs.push(r.label));
  const rpad=(!mob&&rlabs.length)?Math.max(14,Math.max(...rlabs.map(t=>t.length))*5.4+14):14;
  const pad={l:mob?46:38,r:rpad,t:14,b:mob?34:26}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const pts=data.filter(d=>d[yKey]!=null);
  const ys=pts.map(d=>d[yKey]); let ymin=Math.min(...ys),ymax=Math.max(...ys);
  bands.forEach(b=>{ymin=Math.min(ymin,b.lo);ymax=Math.max(ymax,b.hi);});
  refs.forEach(r=>{ymin=Math.min(ymin,r.y);ymax=Math.max(ymax,r.y);});
  const padY=(ymax-ymin)*.12||5;
  const ax=niceAxis(ymin-padY,ymax+padY,{maxTicks:mob?4:5}); ymin=ax.min; ymax=ax.max;
  const X=i=>pad.l+(pts.length<2?iw/2:iw*i/(pts.length-1));
  const Y=v=>pad.t+ih-ih*(v-ymin)/(ymax-ymin||1);
  const s=svgEl(w,h);
  // deferred labels, drawn LAST so nothing hides them
  const labels=[];
  // a solid colored tag (white text) used for the in-plot band labels
  const tag=(x,y,fill,text)=>{const cw=text.length*(fs.tag*.54)+10;
    const g=el('g',{});
    g.appendChild(el('rect',{x:x-4,y:y-fs.tag-1,width:cw,height:fs.tag+5,rx:4,fill:cssv(fill),opacity:.92}));
    g.appendChild(el('text',{x,y,'text-anchor':'start',fill:'#fff','font-size':fs.tag,'font-weight':600},text));
    labels.push(g);};
  // a plain label parked in the right margin, aligned to a horizontal line's y
  const marginLabel=(y,fill,text,bold)=>labels.push(
    el('text',{x:pad.l+iw+6,y:y+3,'text-anchor':'start',fill:cssv(fill),'font-size':fs.ref,'font-weight':bold?600:400},text));
  bands.forEach(b=>{const y1=Y(Math.min(b.hi,ymax)),y2=Y(Math.max(b.lo,ymin));
    if(b.hi>ymin&&b.lo<ymax){s.appendChild(el('rect',{x:pad.l,y:y1,width:iw,height:Math.max(0,y2-y1),fill:cssv(b.color),opacity:.14}));
      // On mobile the wordy band caption goes to the legend; keep only the range
      // in-plot so it never covers the dots on a narrow chart.
      if(b.label)tag(pad.l+6,y1+13,b.color,mob?(b.short||b.label):b.label);}});
  ax.ticks.forEach(v=>{const y=Y(v);
    s.appendChild(el('line',{x1:pad.l,y1:y,x2:pad.l+iw,y2:y,stroke:cssv('--grid'),'stroke-width':1}));
    s.appendChild(el('text',{x:pad.l-6,y:y+3,'text-anchor':'end',fill:cssv('--muted'),'font-size':fs.ax},ax.fmt(v)));});
  if(baseline!=null){const y=Y(baseline);s.appendChild(el('line',{x1:pad.l,y1:y,x2:pad.l+iw,y2:y,stroke:cssv('--baseline'),'stroke-width':1.5,'stroke-dasharray':'4 4'}));
    if(!mob)marginLabel(y,'--muted',`baseline ${fmt(baseline)}`,false);}
  refs.forEach(r=>{const y=Y(r.y);s.appendChild(el('line',{x1:pad.l,y1:y,x2:pad.l+iw,y2:y,stroke:cssv(r.color||'--muted'),'stroke-width':1.5,'stroke-dasharray':'2 3'}));
    if(!mob)marginLabel(y,r.color||'--muted',r.label,true);});
  if(line){const dpath=pts.map((d,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(d[yKey]).toFixed(1)}`).join(' ');
    s.appendChild(el('path',{d:dpath,fill:'none',stroke:cssv(ptColor?'--baseline':color),'stroke-width':(ptColor?1.5:2)*(mob?1.4:1),'stroke-linejoin':'round','stroke-linecap':'round',opacity:ptColor?.7:1}));}
  // The whole chart is downscaled to fit a phone, so draw fatter dots on mobile
  // to land at a size that is easy to see (and to aim at).
  const pr=mob?(ptColor?8:7):(ptColor?5:4), pw=mob?3:2;
  pts.forEach((d,i)=>{const col=ptColor?ptColor(d):color;
    const c=el('circle',{cx:X(i),cy:Y(d[yKey]),r:pr,fill:ptColor?cssv(col):cssv('--surface'),stroke:cssv(col),'stroke-width':pw});
    s.appendChild(c);});
  // Anchor the end labels inward: centred text at the plot edge overflows the
  // padding and gets clipped by the viewBox (the newest date lost its tail).
  [...new Set([0,Math.floor(pts.length/2),pts.length-1])].forEach(i=>{if(pts[i])
    s.appendChild(el('text',{x:X(i),y:h-8,
      'text-anchor':i===0?'start':i===pts.length-1?'end':'middle',
      fill:cssv('--muted'),'font-size':fs.date},pts[i].date.slice(5)));});
  labels.forEach(l=>s.appendChild(l));  // labels on top
  // big invisible tap targets: full-height column per point, so a tap anywhere near a point selects it
  const spacing=pts.length>1?iw/(pts.length-1):iw;
  pts.forEach((d,i)=>{let hx=X(i)-spacing/2,hw=spacing;
    if(hx<pad.l){hw-=pad.l-hx;hx=pad.l;} if(hx+hw>pad.l+iw)hw=pad.l+iw-hx;
    const hit=el('rect',{x:hx,y:pad.t,width:Math.max(1,hw),height:ih,fill:'transparent','pointer-events':'all'});
    bindTip(hit, tipHtml?tipHtml(d):`<b>${fmtDate(d.date)}</b>${fmt(d[yKey])}${unit}`);s.appendChild(hit);});
  return s;
}

function groupedBars(data,{w=680,h=240}){
  const mob=MOBILE(), fs=FS();
  const pad={l:mob?42:34,r:10,t:14,b:mob?40:34}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const ax=niceAxis(0,Math.max(10,...data.map(d=>Math.max(d.planned,d.actual)))*1.1,{zero:true,maxTicks:5});
  const ymax=ax.max, Y=v=>pad.t+ih-ih*v/ymax;
  // Cap the group width so a 2-week window draws two normal bars, not two slabs.
  const bw=iw/data.length, inner=Math.min(bw*0.7,86), each=inner/2;
  const s=svgEl(w,h);
  ax.ticks.forEach(v=>{const y=Y(v);
    s.appendChild(el('line',{x1:pad.l,y1:y,x2:pad.l+iw,y2:y,stroke:cssv('--grid'),'stroke-width':1}));
    s.appendChild(el('text',{x:pad.l-6,y:y+3,'text-anchor':'end',fill:cssv('--muted'),'font-size':fs.ax},ax.fmt(v)));});
  data.forEach((d,i)=>{const x0=pad.l+bw*i+(bw-inner)/2;
    const mk=(val,off,color,cls)=>{const y=Y(val),bh=pad.t+ih-y;
      const r=el('rect',{x:x0+off,y,width:each-2,height:Math.max(0,bh),rx:3,fill:cssv(color)});
      bindTip(r,`<b>Week ${d.week}</b>Planned: ${d.planned} mi<br>Actual: ${d.actual} mi`);s.appendChild(r);};
    mk(d.planned,0,'--baseline','planned'); mk(d.actual,each,'--blue','actual');
    if(i%2===0||data.length<=12)s.appendChild(el('text',{x:x0+inner/2,y:h-16,'text-anchor':'middle',fill:cssv('--muted'),'font-size':mob?13:9},d.week));
  });
  s.appendChild(el('text',{x:pad.l+iw/2,y:h-3,'text-anchor':'middle',fill:cssv('--muted'),'font-size':fs.date},'training week'));
  return s;
}

function barChart(data,{yKey,w=680,h=200,color='--blue',target=null,unit='',tipHtml=null}){
  const mob=MOBILE(), fs=FS();
  const tlab=target!=null?`target ${target}${unit}`:null;
  const pad={l:mob?42:34,r:(tlab&&!mob)?tlab.length*5.4+14:10,t:14,b:mob?32:26},
    iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const pts=data.filter(d=>d[yKey]!=null);
  const ax=niceAxis(0,Math.max(1,...pts.map(d=>d[yKey]),target||0)*1.1,{zero:true,maxTicks:5});
  const ymax=ax.max, Y=v=>pad.t+ih-ih*v/ymax, bw=iw/pts.length;
  const s=svgEl(w,h);
  ax.ticks.forEach(v=>{const y=Y(v);
    s.appendChild(el('line',{x1:pad.l,y1:y,x2:pad.l+iw,y2:y,stroke:cssv('--grid'),'stroke-width':1}));
    s.appendChild(el('text',{x:pad.l-6,y:y+3,'text-anchor':'end',fill:cssv('--muted'),'font-size':fs.ax},ax.fmt(v)));});
  pts.forEach((d,i)=>{const y=Y(d[yKey]),x=pad.l+bw*i+bw*0.15;
    const r=el('rect',{x,y,width:bw*0.7,height:Math.max(0,pad.t+ih-y),rx:3,fill:cssv(color)});
    s.appendChild(r);});
  if(target!=null){const y=Y(target);s.appendChild(el('line',{x1:pad.l,y1:y,x2:pad.l+iw,y2:y,stroke:cssv('--baseline'),'stroke-width':1.5,'stroke-dasharray':'4 4'}));
    if(!mob)s.appendChild(el('text',{x:pad.l+iw+6,y:y+3,'text-anchor':'start',fill:cssv('--muted'),'font-size':fs.ref},tlab));}
  [...new Set([0,Math.floor(pts.length/2),pts.length-1])].forEach(i=>{if(pts[i])
    s.appendChild(el('text',{x:Math.min(Math.max(pad.l+bw*i+bw/2,pad.l),pad.l+iw),y:h-8,
      'text-anchor':i===0?'start':i===pts.length-1?'end':'middle',
      fill:cssv('--muted'),'font-size':fs.date},pts[i].date.slice(5)));});
  // full-height tap targets per bar
  pts.forEach((d,i)=>{const hit=el('rect',{x:pad.l+bw*i,y:pad.t,width:bw,height:ih,fill:'transparent','pointer-events':'all'});
    bindTip(hit, tipHtml?tipHtml(d):`<b>${fmtDate(d.date)}</b>${d[yKey]}${unit}`);s.appendChild(hit);});
  return s;
}

// donut ring for readiness
function ring(score,color){
  const w=120,r=48,cx=60,cy=60,circ=2*Math.PI*r;
  const s=svgEl(w,w);
  s.appendChild(el('circle',{cx,cy,r,fill:'none',stroke:cssv('--grid'),'stroke-width':11}));
  s.appendChild(el('circle',{cx,cy,r,fill:'none',stroke:cssv(color),'stroke-width':11,'stroke-linecap':'round',
    'stroke-dasharray':`${circ*score/100} ${circ}`,transform:`rotate(-90 ${cx} ${cy})`}));
  s.appendChild(el('text',{x:cx,y:cy+2,'text-anchor':'middle',fill:cssv('--text'),'font-size':30,'font-weight':650},String(score)));
  s.appendChild(el('text',{x:cx,y:cy+20,'text-anchor':'middle',fill:cssv('--muted'),'font-size':11},'readiness'));
  return s;
}

// ---------- render ----------
function card(title,sub,node){
  return el('div',{class:'card'},[
    title&&el('div',{class:'chart-title',text:title}),
    sub&&el('div',{class:'chart-sub',text:sub}),
    node
  ].filter(Boolean));
}
// Legend swatches: solid square (series), thin bar (line), dashed bar (reference
// line), translucent block (HR band). Bands and reference lines are labelled here
// because on mobile their in-plot captions are dropped to keep the plot readable.
function legend(items){return el('div',{class:'legend'},items.map(it=>{
  const c=cssv(it.color);
  const cls=(it.line||it.dash)?'line':'';
  const st=it.dash?`background:none;height:0;border-top:2px dashed ${c}`
    :it.band?`background:${c};opacity:.5`:`background:${c}`;
  return el('span',{},[el('i',{class:cls,style:st}),it.label]);}));}

// ---------- trends time-window ----------
function dayShift(iso,n){const d=new Date(iso+'T00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function trendWindow(){
  const rec=DATA.series.recovery;
  const minD=rec.length?rec[0].date:null, maxD=rec.length?rec[rec.length-1].date:null;
  if(winState.all||!rec.length) return {start:minD,end:maxD,atOldest:true,atNewest:true};
  const end=dayShift(maxD,-winState.offset*7);
  const start=dayShift(end,-(winState.weeks*7-1));
  return {start,end,atOldest:start<=minD,atNewest:winState.offset<=0};
}
const inWin=(arr,w)=>arr.filter(x=>x.date>=w.start&&x.date<=w.end);

function updateTrends(){
  const ctl=$('#winctl'), grid=$('#chartgrid'); if(!ctl||!grid)return;
  const w=trendWindow(), hasV=(a,k)=>a.some(x=>x[k]!=null), empty=t=>el('div',{class:'norange',text:t});
  // ---- window controls ----
  ctl.innerHTML='';
  const seg=el('div',{class:'seg'},[
    el('button',{class:'segbtn'+(winState.all?'':' on'),text:`${winState.weeks}-week view`}),
    el('button',{class:'segbtn'+(winState.all?' on':''),text:'All'})]);
  seg.children[0].addEventListener('click',()=>{winState.all=false;updateTrends();});
  seg.children[1].addEventListener('click',()=>{winState.all=true;updateTrends();});
  ctl.appendChild(seg);
  if(!winState.all){
    const prev=el('button',{class:'stepbtn',html:'‹ older'});
    const next=el('button',{class:'stepbtn',html:'newer ›'});
    if(w.atOldest)prev.setAttribute('disabled','');else prev.addEventListener('click',()=>{winState.offset++;updateTrends();});
    if(w.atNewest)next.setAttribute('disabled','');else next.addEventListener('click',()=>{winState.offset=Math.max(0,winState.offset-1);updateTrends();});
    ctl.appendChild(el('div',{class:'stepper'},[prev,el('span',{class:'winlab',text:`${fmtDate(w.start)} – ${fmtDate(w.end)}`}),next]));
  }
  // ---- charts ----
  grid.innerHTML='';
  const rec=winState.all?DATA.series.recovery:inWin(DATA.series.recovery,w);
  const runs=winState.all?DATA.series.runs:inWin(DATA.series.runs,w);
  const eb=DATA.series.easy_band;

  // Weekly mileage follows the same window: a week counts if its Mon-Sun span
  // overlaps the window at all (weeks carry start/end, not a single date).
  const weekly=winState.all?DATA.series.weekly
    :DATA.series.weekly.filter(x=>(x.end||x.start)>=w.start&&(x.start||x.end)<=w.end);
  const wk=card('Weekly mileage: planned vs actual','Filled = actual, gray = plan target',
    weekly.length
      ? el('div',{class:'scroll'},groupedBars(weekly,{w:Math.max(680,weekly.length*32)}))
      : empty('No plan weeks in this range.'));
  if(weekly.length)wk.appendChild(legend([{color:'--baseline',label:'planned'},{color:'--blue',label:'actual'}]));
  grid.appendChild(wk);

  grid.appendChild(card('Resting heart rate','Lower & stable = recovered. Dashed line is your baseline.',
    hasV(rec,'resting_hr')
      ? el('div',{},[
          el('div',{class:'scroll'},lineChart(rec,{yKey:'resting_hr',color:'#ae5225',baseline:M_baseline(DATA),unit:' bpm',
            tipHtml:d=>`<b>${fmtDate(d.date)} · resting HR</b>${d.resting_hr} bpm${d.sleep_score?` · sleep ${d.sleep_score}`:''}`})),
          // the in-plot baseline caption is dropped on mobile, so keep its value here
          legend([{color:'#ae5225',label:'resting HR'},
            {color:'--baseline',dash:true,label:`your baseline ${M_baseline(DATA)} bpm`}])])
      : empty('No resting-HR data in this range.')));

  grid.appendChild(card('Sleep duration','Nightly hours. Dashed line = 7.5h feel-good target.',
    hasV(rec,'sleep_hours')
      ? el('div',{class:'scroll'},barChart(rec,{yKey:'sleep_hours',color:'--green',target:7.5,unit:'h',
          tipHtml:d=>`<b>${fmtDate(d.date)} · sleep</b>${d.sleep_hours} h${d.sleep_score?` · score ${d.sleep_score}`:''}`}))
      : empty('No sleep data in this range.')));

  const runHR=card('Effort per run: easy vs moderate HR',
    MOBILE()
      ? 'Each dot is a run, colored by intended effort.'
      : `Each dot is a run, colored by intended effort. Green band is your easy range (~${eb.lo}-${eb.hi} bpm, median ${eb.median}); upper band is tempo.`,
    hasV(runs,'avg_hr')
      ? el('div',{},[
          el('div',{class:'scroll'},lineChart(runs,{yKey:'avg_hr',unit:' bpm',
            ptColor:r=>r.intent==='hard'?'--red':'--blue',
            tipHtml:r=>`<b style="color:${cssv(r.intent==='hard'?'--red':'--blue')}">${fmtDate(r.date)} · ${r.planned_type||'run'}</b>${r.miles} mi · avg ${r.avg_hr} bpm · max ${r.max_hr||'–'} bpm`,
            bands:[{lo:eb.lo,hi:eb.hi,color:'--green',label:`Easy · talk test (~${eb.lo}-${eb.hi})`,short:`${eb.lo}-${eb.hi}`},
                   {lo:166,hi:178,color:'--orange',label:'Moderate · tempo (few words, 165-175)',short:'165-175'}],
            refs:[{y:eb.median,color:'--blue',label:`easy median ${eb.median}`}]})),
          legend([
            {color:'--blue',label:'easy day'},
            {color:'--red',label:'hard day (tempo/interval)'},
            {color:'--green',band:true,label:`easy band ${eb.lo}-${eb.hi} bpm`},
            {color:'--orange',band:true,label:'tempo band 165-175'},
            {color:'--blue',dash:true,label:`your easy median ${eb.median}`}])])
      : empty('No runs in this range.'));
  if(hasV(runs,'avg_hr'))runHR.appendChild(legend([{color:'--blue',label:'easy · long · strides'},{color:'--red',label:'tempo · interval'}]));
  grid.appendChild(runHR);
}

function render(d){
  DATA=d;
  $('#stamp').textContent = `updated ${d.generated_at.replace('T',' ')} · ${d.milestones.weeks_to_race} wks to race`;
  const app=$('#app'); app.innerHTML='';
  const R=d.readiness, M=d.milestones, W=d.weekly;
  const rc = R.score>=72?'--good':R.score>=55?'--warning':'--critical';

  // Readiness hero. The score describes a moment, not a day, so say which moment
  // and show how it moves from wake to the hour she will actually be running.
  const body=[el('div',{class:'label',text:R.label}),el('div',{class:'asof',text:asofLine(R)}),
    el('div',{class:'verdict',text:R.verdict})];
  dayline(R,d.outlook||{}).forEach(n=>body.push(n));
  body.push(el('ul',{class:'reasons'},R.reasons.map(x=>el('li',{text:x}))));
  app.appendChild(el('section',{},[
    el('div',{class:'card hero'},[el('div',{class:'ring'},ring(R.score,rc)),el('div',{class:'body'},body)])
  ]));

  // Milestone tiles
  const tiles=[
    ['Weeks to race',M.weeks_to_race,'Nov 7 half'],
    ['Plan week',`${M.current_week}<small>/20</small>`,`${M.consistency_pct}% workouts done`],
    ['Total miles',M.total_miles,`${M.total_runs} runs logged`],
    ['Longest run',`${M.longest_run_mi}<small>mi</small>`,'building endurance'],
    ['VO₂max',(M.vo2max!=null?M.vo2max:'–'), M.vo2max_change>0?`<span class="up">▲ +${M.vo2max_change}</span> recent`:(M.vo2max_change!=null?`${M.vo2max_change} recent`:'')],
    ['This week',`${W.actual_miles}<small>/${W.planned_miles} mi</small>`,`${W.runs_done}/${W.runs_planned} runs`],
  ];
  app.appendChild(el('section',{},[
    el('h2',{text:'Milestones'}),
    el('div',{class:'grid tiles'},tiles.map(([k,v,dd])=>el('div',{class:'card tile'},[
      el('div',{class:'k',text:k}), el('div',{class:'v',html:String(v)}), el('div',{class:'d',html:dd||''})
    ])))
  ]));

  // Adjustments
  app.appendChild(el('section',{},[
    el('h2',{text:'Plan adjustments'}),
    el('div',{class:'stack'},d.adjustments.map(a=>el('div',{class:`note ${a.severity}`},[
      el('span',{class:'tag',text:a.severity==='high'?'Action':a.severity==='med'?'Heads up':'Note'}),
      el('div',{text:a.text})
    ])))
  ]));

  // Tips
  app.appendChild(el('section',{},[
    el('h2',{text:'Coaching tips'}),
    el('div',{class:'stack'},d.tips.map(t=>el('div',{class:`note ${t.kind}`},[
      el('span',{class:'tag',text:t.kind}), el('div',{text:t.text})
    ])))
  ]));

  // Charts (with a week-window pager; see updateTrends)
  app.appendChild(el('section',{},[el('h2',{text:'Trends'}),
    el('div',{class:'winctl',id:'winctl'}),
    el('div',{class:'grid',id:'chartgrid',style:'gap:14px'})]));
  updateTrends();

  // Full schedule from the plan start (6/22), grouped by week.
  // Built as a stacked list rather than a wide table: six columns of workout data
  // never fit a phone without sideways scrolling, so each workout gets two lines
  // (identity on top, plan vs actual underneath) that wrap instead of overflow.
  SCHED=d.plan.slice().sort((a,b)=>a.date<b.date?-1:1);
  const list=el('div',{class:'sched'});
  let curWk=null;
  SCHED.forEach((w,i)=>{
    if(w.week!==curWk){curWk=w.week;
      list.appendChild(el('div',{class:'wkhead'},[
        el('span',{text:`Week ${w.week}`}),
        el('span',{class:'wkdates',text:fmtDate(w.date)})]));}
    const c=effortColor(w.type), a=w.actual;
    const stat=(lab,val,cls)=>el('span',{class:'sv '+(cls||'')},[
      el('span',{class:'sv-k',text:lab}),el('span',{class:'sv-v',html:val})]);
    const row=el('div',{class:'srow',role:'button',tabindex:'0'},[
      el('div',{class:'sr-top'},[
        el('span',{class:'sr-day',text:w.weekday}),
        el('span',{class:'sr-date',text:fmtDate(w.date)}),
        w.moved_to?el('span',{class:'moved',text:`→ ${fmtDate(w.moved_to)}`}):null,
        el('span',{class:'wt',style:`background:${cssv(c)};color:${c==='--red'?'#fff':'#2a1c0e'}`,text:w.type}),
        el('span',{class:'sr-gap'}),
        // a run you deliberately moved reads as "moved", never as a lapse
        el('span',{class:`pill ${w.rescheduled&&w.status==='upcoming'?'moved':w.status}`,
          text:w.rescheduled&&w.status==='upcoming'?'moved':w.status}),
        // only runs still ahead of you can be moved; a logged run has happened
        w.status!=='done'?mkMoveBtn(i):null,
        el('span',{class:'chev',text:'›'})]),
      el('div',{class:'sr-bot'},[
        stat('plan',w.planned_miles?`${w.planned_miles} mi`:'rest'),
        a?stat('ran',`${a.distance_mi} mi`,'hit'):null,
        a&&a.avg_hr?stat('avg HR',`${a.avg_hr} bpm`):null,
        a&&a.avg_pace_min_per_mi?stat('pace',`${Math.floor(a.avg_pace_min_per_mi)}:${String(Math.round((a.avg_pace_min_per_mi%1)*60)).padStart(2,'0')} /mi`):null,
        !a&&w.status==='missed'?stat('ran','not logged','miss'):null].filter(Boolean))]);
    row.addEventListener('click',()=>openDetail(i));
    row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(i);}});
    list.appendChild(row);});
  app.appendChild(el('section',{},[el('h2',{text:'Schedule'}),
    el('div',{class:'card schedcard'},list)]));
}
const scoreColor=s=>s>=72?'--good':s>=55?'--warning':'--critical';

// The readiness score is only true for one moment, so name it. If the watch has
// not synced recently, say so rather than passing off a projection as a reading.
function asofLine(R){
  const bits=[`as of ${R.at_label}`];
  if(R.body_battery!=null)bits.push(`Body Battery ${R.body_battery}`);
  if(R.stale_min>45&&R.synced_at)bits.push(`watch last synced ${R.synced_at}`);
  return bits.join(' · ');
}

// wake -> now -> the hour she usually runs. Answers "is my morning 91 still a 91
// when I go out at 5:30?" without her having to guess.
function dayline(R,O){
  const pts=[];
  if(O.morning)pts.push({t:`woke ${O.morning.at_label}`,s:O.morning.score,l:O.morning.label});
  pts.push({t:`now ${R.at_label}`,s:R.score,l:R.label,cls:'now'});
  if(O.at_run)pts.push({t:`run ~${O.at_run.at_label}`,s:O.at_run.score,l:O.at_run.label,cls:'proj'});
  if(pts.length<2)return [];
  const row=el('div',{class:'tline'},pts.map(p=>el('div',{class:'tpt '+(p.cls||'')},[
    el('div',{class:'t',text:p.t}),
    el('div',{class:'s',style:`color:${cssv(scoreColor(p.s))}`,text:String(p.s)}),
    el('div',{class:'l',text:p.l})])));
  const out=[row];
  if(O.at_run){
    const w=O.workout||{}, gap=R.score-O.at_run.score;
    const move=gap>=8?`about ${gap} points below where you are now`
      :gap>=3?`a few points below where you are now`
      :gap<=-3?`slightly better than right now`:`about where you are now`;
    out.push(el('div',{class:'projnote',text:
      `Projected for ${w.miles?`your ${w.miles} mi ${w.type||'run'}`:'your run'} around ${O.at_run.at_label}, `+
      `the time you usually run on this day: ${move}. It follows how your Body Battery normally falls `+
      `through the afternoon, so treat it as an estimate that firms up as the day gets logged.`}));
  }
  return out;
}

function M_baseline(d){return d.readiness.baseline_rhr;}

// A move button that never triggers the row's own open-detail click.
function mkMoveBtn(i,label){
  const b=el('button',{class:'movebtn',text:label||'⇄ Move'});
  b.addEventListener('click',e=>{e.stopPropagation();openReschedule(i);});
  return b;
}

// ---------- reschedule dialog ----------
// The date a workout is actually due: its reschedule target when it has one.
const effDate=w=>w.moved_to||w.date;
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
const wdayLong=iso=>{try{return new Date(iso+'T00:00').toLocaleDateString('en-US',{weekday:'short'});}catch(e){return '';}};

function openReschedule(i){
  const w=SCHED[i]; if(!w)return;
  let target=effDate(w);
  const sheet=$('#rssheet'); sheet.innerHTML='';
  const x=el('button',{class:'closex',html:'&times;'});
  x.addEventListener('click',closeReschedule); sheet.appendChild(x);
  sheet.appendChild(el('div',{class:'grab'}));
  sheet.appendChild(el('h3',{text:'Reschedule'}));
  sheet.appendChild(el('div',{class:'rs-meta',text:w.summary||`${w.type} run`}));
  sheet.appendChild(el('div',{class:'rs-cur',html:
    `Planned for ${wdayLong(w.date)} ${fmtDate(w.date)}`+
    (w.moved_to?` · already moved to <b>${wdayLong(w.moved_to)} ${fmtDate(w.moved_to)}</b>`:'')}));

  // Quick pick: the next 7 days from today, which on a phone beats opening the
  // calendar for what is nearly always a move of a day or two.
  sheet.appendChild(el('div',{class:'rs-lab',text:'Quick pick'}));
  const chips=el('div',{class:'rs-chips'});
  const base=todayISO();
  for(let k=0;k<7;k++){
    const iso=dayShift(base,k);
    const taken=SCHED.some(o=>o!==w&&effDate(o)===iso);
    const c=el('button',{class:'rs-chip'+(iso===target?' on':'')+(taken?' busy':''),
      title:taken?'Another workout is already on this day':''},
      [el('b',{text:k===0?'Today':wdayLong(iso)}),fmtDate(iso)]);
    c.addEventListener('click',()=>{target=iso;sync();});
    c.dataset.iso=iso; chips.appendChild(c);
  }
  sheet.appendChild(chips);

  sheet.appendChild(el('div',{class:'rs-lab',text:'Or pick any date'}));
  const input=el('input',{type:'date',value:target});
  input.addEventListener('change',()=>{if(input.value){target=input.value;sync();}});
  sheet.appendChild(input);

  const warn=el('div',{class:'rs-warn',style:'display:none'});
  sheet.appendChild(warn);

  const save=el('button',{class:'rs-save grow',text:'Save'});
  const cancel=el('button',{text:'Cancel'});
  cancel.addEventListener('click',closeReschedule);
  const acts=[cancel];
  if(w.moved_to){
    const reset=el('button',{class:'rs-reset',text:`Reset to ${fmtDate(w.date)}`});
    reset.addEventListener('click',()=>commit(w,null,reset));
    acts.push(reset);
  }
  acts.push(save);
  save.addEventListener('click',()=>commit(w,target,save));
  sheet.appendChild(el('div',{class:'rs-actions'},acts));

  // Keep chips, input, warning and the Save button agreeing with the current target.
  function sync(){
    [...chips.children].forEach(c=>c.classList.toggle('on',c.dataset.iso===target));
    if(input.value!==target)input.value=target;
    const clash=SCHED.find(o=>o!==w&&effDate(o)===target);
    const msgs=[];
    if(clash)msgs.push(`${wdayLong(target)} ${fmtDate(target)} already has a workout: ${clash.type}${clash.planned_miles?` (${clash.planned_miles} mi)`:''}. Two workouts on one day both match the same run, so only one will register.`);
    if(target<todayISO())msgs.push(`That date is in the past. If you already ran it, it will match the run logged that day.`);
    warn.style.display=msgs.length?'block':'none';
    warn.innerHTML=msgs.join('<br><br>');
    save.disabled=(target===effDate(w));
    save.textContent=target===w.date&&w.moved_to?'Move back':'Save';
  }
  sync();
  if(!$('#rsoverlay').classList.contains('open')){
    if(!$('#overlay').classList.contains('open'))lockScroll();
    $('#rsoverlay').classList.add('open');
  }
}

function closeReschedule(){
  $('#rsoverlay').classList.remove('open');
  if(!$('#overlay').classList.contains('open'))unlockScroll();
}

// Write the change, then re-render from the server so status, adjustments and
// the evaluation all reflect it. null newDate clears the reschedule.
async function commit(w,newDate,btn){
  const label=btn.textContent; btn.textContent='Saving…'; btn.disabled=true;
  try{
    const r=newDate
      ? await fetch('/api/reschedule',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({orig_date:w.date,new_date:newDate,note:'moved from the dashboard'})})
      : await fetch(`/api/reschedule/${w.date}`,{method:'DELETE'});
    if(!r.ok)throw new Error(r.status);
    closeReschedule(); closeDetail();
    await load(true);
  }catch(e){
    btn.textContent=label; btn.disabled=false;
    const warn=$('#rssheet .rs-warn');
    if(warn){warn.style.display='block';warn.textContent=`Couldn't save (${e.message}). The server may be down.`;}
  }
}

// ---------- workout detail modal ----------
function warmup(type){
  const dyn='Dynamic drills: leg swings (front/back + side), high knees, butt kicks, 10 each.';
  if(type==='shakeout'||type==='easy') return ['Start at a walk for 2-3 min, then ease into a relaxed jog.','No formal warmup needed. Let the first mile be the warmup.'];
  if(type==='long') return ['5 min brisk walk or very easy jog to loosen up.','A few leg swings if the legs feel stiff.','Settle straight into easy, conversational pace.'];
  if(type==='quality') return ['10 min easy jog.',dyn,'Then run the strides as prescribed (relaxed accelerations, full walk recovery).'];
  if(type==='tempo') return ['10-15 min easy jog to warm up properly.',dyn,'4 x 20-sec strides to prime the legs.','Then begin the tempo portion.'];
  if(type==='race') return ['10 min easy jog, building slightly toward the end.',dyn,'3-4 short strides.','Then to the start line. Go out easy, even effort.'];
  return ['Ease in with a few easy minutes before picking up effort.'];
}
function openDetail(i){
  schedIdx=Math.max(0,Math.min(SCHED.length-1,i));
  const w=SCHED[schedIdx];
  const sheet=$('#sheet'); sheet.innerHTML='';
  const x=el('button',{class:'closex',html:'&times;'}); x.addEventListener('click',closeDetail);
  sheet.appendChild(x);
  sheet.appendChild(el('div',{class:'grab'}));
  // prev / next navigation through the schedule
  const mkNav=(label,delta,disabled)=>{const b=el('button',{class:'navbtn',html:label});
    if(disabled)b.setAttribute('disabled','');
    else b.addEventListener('click',e=>{e.stopPropagation();openDetail(schedIdx+delta);});return b;};
  sheet.appendChild(el('div',{class:'navrow'},[
    mkNav('‹ Prev',-1,schedIdx<=0),
    el('span',{class:'navpos',text:`${schedIdx+1} / ${SCHED.length}`}),
    mkNav('Next ›',1,schedIdx>=SCHED.length-1)]));
  if(w.status!=='done')sheet.appendChild(
    el('div',{style:'margin:0 0 14px'},mkMoveBtn(schedIdx,'⇄ Reschedule this run')));
  const mi=w.planned_miles?`${w.planned_miles} mi · `:'';
  sheet.appendChild(el('h3',{text:w.summary||`${w.type} run`}));
  sheet.appendChild(el('div',{class:'meta',text:`Week ${w.week} · ${w.date} (${w.weekday}) · ${mi}${w.type}${w.moved_to?` · moved to ${w.moved_to}`:''}`}));

  if(w.actual){
    const a=w.actual;
    const stats=[['Distance',`${a.distance_mi} mi`],['Time',`${a.duration_min} min`],
        ['Avg HR',`${a.avg_hr||'–'} bpm`],['Max HR',`${a.max_hr||'–'} bpm`],
        ['Pace',a.avg_pace_min_per_mi?`${a.avg_pace_min_per_mi} /mi`:'–']];
    if(a.avg_cadence) stats.push(['Cadence',`${Math.round(a.avg_cadence)} spm`]);
    if(a.vo2max) stats.push(['VO₂max',`${a.vo2max}`]);
    sheet.appendChild(el('div',{class:'block'},[el('div',{class:'lab',text:'How it went'}),
      el('div',{class:'statrow'},stats.map(([k,v])=>el('div',{class:'s'},[el('div',{class:'k',text:k}),el('div',{class:'v',text:v})])))]));

    // coaching evaluation of the completed run
    if(w.evaluation){const ev=w.evaluation;
      // at-a-glance chips: where this sat among runs of the same kind, the
      // weather it was run in, and how recovered she was when she set off
      const chips=[];
      if(ev.comparison){const c=ev.comparison;
        chips.push(`#${c.rank} of ${c.n_peers+1} ${c.type} runs`);
        chips.push(`${c.pct_vs_median>=0?'+':''}${c.pct_vs_median}% vs your median`);}
      if(ev.conditions) chips.push(ev.conditions.indoor?'treadmill':
        `${Math.round(ev.conditions.temp_f)}°F, dew ${Math.round(ev.conditions.dew_f)}°`);
      // always name the hour: this is readiness at the start line, not at breakfast
      if(ev.readiness_that_day!=null) chips.push(
        `readiness ${ev.readiness_that_day}${ev.readiness_at?` at ${ev.readiness_at}`:''}`
        +(ev.readiness_morning?` (${ev.readiness_morning} that morning)`:''));
      sheet.appendChild(el('div',{class:'block'},[el('div',{class:'lab',text:'Evaluation'}),
        el('div',{class:`eval ${ev.rating}`},[
          el('div',{class:'eval-h',text:ev.headline}),
          chips.length?el('div',{class:'eval-meta'},chips.map(t=>el('span',{class:'chip',text:t}))):null,
          el('ul',{class:'eval-pts'},ev.points.map(p=>el('li',{text:p})))
        ])]));
    }

    // the note you wrote on the Garmin activity
    if(a.notes) sheet.appendChild(el('div',{class:'block'},[el('div',{class:'lab',text:'Your Garmin note'}),
      el('div',{class:'warm'},el('div',{class:'txt',text:a.notes}))]));
  }

  sheet.appendChild(el('div',{class:'block'},[el('div',{class:'lab',text:'Warmup routine'}),
    el('div',{class:'warm'},el('ol',{},warmup(w.type).map(x=>el('li',{text:x}))))]));

  if(w.description) sheet.appendChild(el('div',{class:'block'},[el('div',{class:'lab',text:'Workout & notes'}),
    el('div',{class:'txt',text:w.description})]));

  if(!$('#overlay').classList.contains('open')){lockScroll();$('#overlay').classList.add('open');}
}
// Pin the page behind the sheet. position:fixed is used rather than
// overflow:hidden because iOS ignores the latter on body; the scroll offset is
// stashed and restored so closing lands you back where you were.
let _lockY=0;
function lockScroll(){_lockY=window.scrollY||0;
  document.body.style.top=`-${_lockY}px`;document.body.classList.add('locked');}
function unlockScroll(){if(!document.body.classList.contains('locked'))return;
  document.body.classList.remove('locked');document.body.style.top='';
  window.scrollTo(0,_lockY);}
function closeDetail(){const s=$('#sheet');s.classList.remove('snap');s.style.transform='';s.style.opacity='';
  $('#overlay').classList.remove('open');unlockScroll();}

// ---- mobile swipe gestures on the detail sheet ----
// Left/right pages through the schedule (mirrors the Prev/Next buttons and the
// desktop arrow keys); a downward drag dismisses. Vertical dragging only takes
// over when the sheet is already scrolled to the top, so normal content
// scrolling still works, and the axis is locked on first movement so a scroll
// never turns into an accidental navigation.
(function(){
  const sheet=$('#sheet');
  const SWIPE_X=50, SWIPE_Y=90, SLOP=8;
  let sx=0,sy=0,dx=0,dy=0,axis=null,tracking=false,atTop=false;

  const reset=(animate)=>{
    if(animate){sheet.classList.add('snap');setTimeout(()=>sheet.classList.remove('snap'),240);}
    sheet.style.transform='';sheet.style.opacity='';
    axis=null;tracking=false;dx=dy=0;
  };

  sheet.addEventListener('touchstart',e=>{
    if(!MOBILE()||e.touches.length!==1){tracking=false;return;}
    // let horizontally scrollable children (charts) keep their own panning
    if(e.target.closest&&e.target.closest('.scroll')){tracking=false;return;}
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=dy=0;axis=null;tracking=true;
    atTop=sheet.scrollTop<=0;
    sheet.classList.remove('snap');
  },{passive:true});

  sheet.addEventListener('touchmove',e=>{
    if(!tracking||e.touches.length!==1)return;
    const t=e.touches[0];dx=t.clientX-sx;dy=t.clientY-sy;
    if(!axis){
      const adx=Math.abs(dx),ady=Math.abs(dy);
      if(adx<SLOP&&ady<SLOP)return;
      // touch-action:pan-y guarantees a sideways drag is ours, so a simple
      // dominant-axis test is enough; downward drags only from the top
      if(adx>ady)axis='x';
      else if(dy>0&&atTop)axis='y';
      else{tracking=false;return;}   // an ordinary vertical scroll: hands off
    }
    if(axis==='x'){
      e.preventDefault();
      // resist at the ends of the schedule so the limit is felt, not guessed
      const end=(dx>0&&schedIdx<=0)||(dx<0&&schedIdx>=SCHED.length-1);
      sheet.style.transform=`translateX(${dx*(end?0.18:0.32)}px)`;
    }else{
      e.preventDefault();
      const d=Math.max(0,dy);
      sheet.style.transform=`translateY(${d*0.55}px)`;
      sheet.style.opacity=String(Math.max(0.45,1-d/460));
    }
  },{passive:false});

  const finish=e=>{
    if(!tracking){reset(false);return;}
    // take the delta from the released touch: the last touchmove can be
    // coalesced away, leaving a stale dx that under-reports the swipe
    const t=e&&e.changedTouches&&e.changedTouches[0];
    if(t){dx=t.clientX-sx;dy=t.clientY-sy;}
    const a=axis,mx=dx,my=dy;
    if(a==='x'&&Math.abs(mx)>SWIPE_X){
      const i=schedIdx+(mx<0?1:-1);
      if(i>=0&&i<SCHED.length){reset(false);openDetail(i);return;}
    }else if(a==='y'&&my>SWIPE_Y){
      sheet.classList.add('snap');
      sheet.style.transform='translateY(110%)';sheet.style.opacity='0';
      setTimeout(()=>{closeDetail();reset(false);},200);
      tracking=false;return;
    }
    reset(true);
  };
  sheet.addEventListener('touchend',finish,{passive:true});
  sheet.addEventListener('touchcancel',()=>reset(true),{passive:true});
  // the dimmed backdrop itself never scrolls anything
  $('#overlay').addEventListener('touchmove',e=>{if(e.target.id==='overlay')e.preventDefault();},{passive:false});
})();
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDetail();});
// charts are sized/labelled differently per breakpoint, so redraw on rotate/resize
window.matchMedia('(max-width:599px)').addEventListener('change',()=>{if(DATA)updateTrends();});
$('#rsoverlay').addEventListener('click',e=>{if(e.target.id==='rsoverlay')closeReschedule();});
document.addEventListener('keydown',e=>{
  // the reschedule dialog sits above the detail sheet, so it closes first
  if(e.key==='Escape'){
    if($('#rsoverlay').classList.contains('open'))closeReschedule();else closeDetail();
    return;}
  if($('#rsoverlay').classList.contains('open'))return;   // don't page behind the dialog
  if(!$('#overlay').classList.contains('open'))return;
  if(e.key==='ArrowLeft'&&schedIdx>0)openDetail(schedIdx-1);
  if(e.key==='ArrowRight'&&schedIdx<SCHED.length-1)openDetail(schedIdx+1);
});
document.addEventListener('pointerdown',()=>{$('#tip').style.display='none';});

// ---------- boot ----------
async function load(keepScroll){
  const y=keepScroll?(window.scrollY||0):0;
  try{
    const r=await fetch('/api/dashboard'); if(!r.ok)throw new Error(r.status);
    render(await r.json());
    if(keepScroll)window.scrollTo(0,y);   // a reschedule shouldn't fling you to the top
  }catch(e){ $('#app').innerHTML=`<div class="err">Couldn't load data (${e.message}).<br>Is the server running & Garmin synced?</div>`; }
}
$('#refresh').addEventListener('click',async()=>{
  const b=$('#refresh'); b.textContent='Syncing…'; b.disabled=true;
  try{ await fetch('/api/refresh',{method:'POST'}); }catch(e){}
  setTimeout(async()=>{ await load(); b.textContent='↻ Sync Garmin'; b.disabled=false; }, 9000);
});
load();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
</script>
